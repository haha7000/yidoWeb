<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 - YIDOWEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #4f46e5;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.05"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .find-container {
            width: 100%;
            max-width: 450px;
            margin: 0 20px;
            position: relative;
            z-index: 1;
        }

        .find-form {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header i {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: block;
        }

        .page-header h2 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .page-header p {
            color: var(--medium-gray);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fff;
            color: #333;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            transform: translateY(-1px);
        }

        .btn-find {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn-find:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-find:active {
            transform: translateY(0);
        }

        .btn-find:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .back-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 14px;
        }

        .back-link a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 25px;
            animation: alertSlide 0.3s ease-out;
            padding: 16px 20px;
        }

        @keyframes alertSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .alert-danger {
            background: linear-gradient(135deg, var(--danger-color), #dc2626);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .info-box {
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary-color);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info-box i {
            color: var(--primary-color);
            margin-right: 8px;
        }

        .info-box p {
            margin: 0;
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .find-form {
                margin: 20px;
                padding: 40px 30px;
            }
            
            .page-header h2 {
                font-size: 24px;
            }
            
            .page-header i {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="find-container">
        <div class="find-form">
            <div class="page-header">
                <i class="fas fa-search"></i>
                <h2>아이디 찾기</h2>
                <p>가입하신 이메일 주소를 입력해주세요<br>해당 이메일로 아이디를 발송해 드립니다</p>
            </div>
            
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <p><strong>안내사항</strong><br>
                • 등록된 이메일 주소로만 아이디 조회가 가능합니다<br>
                • 승인된 계정에 한해서만 조회가 가능합니다<br>
                • 조회 결과는 즉시 이메일로 발송됩니다</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <form id="findUsernameForm">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-2"></i>등록된 이메일 주소
                    </label>
                    <div class="input-group">
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="이메일 주소를 입력해주세요" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-find" id="findBtn">
                    <span class="btn-text">
                        <i class="fas fa-search me-2"></i>아이디 찾기
                    </span>
                </button>
            </form>
            
            <div class="back-link">
                <a href="/login">
                    <i class="fas fa-arrow-left me-1"></i>로그인 페이지로 돌아가기
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('findUsernameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const findBtn = document.getElementById('findBtn');
            const btnText = findBtn.querySelector('.btn-text');
            const alertContainer = document.getElementById('alertContainer');
            
            // 로딩 상태
            findBtn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>처리 중...';
            
            // 기존 알림 제거
            alertContainer.innerHTML = '';
            
            fetch('/auth/find-username/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success" role="alert">
                            <i class="fas fa-check-circle me-2"></i>${data.message}
                        </div>
                    `;
                    form.reset();
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>${data.message}
                        </div>
                    `;
                }
            })
            .catch(error => {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    </div>
                `;
            })
            .finally(() => {
                // 원래 상태로 복구
                findBtn.disabled = false;
                btnText.innerHTML = '<i class="fas fa-search me-2"></i>아이디 찾기';
            });
        });

        // 입력 필드 포커스 애니메이션
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
