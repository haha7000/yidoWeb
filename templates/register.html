<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이도회계법인 매칭시스템 - 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #1e3d72;
            --accent-color: #4a90e2;
            --light-gray: #f8f9fa;
            --medium-gray: #6c757d;
            --success-color: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.05"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.05"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.03"/><circle cx="20" cy="80" r="0.5" fill="white" opacity="0.03"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            margin: 0 20px;
            position: relative;
            z-index: 1;
        }

        .register-form {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .logo h2 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--medium-gray);
            font-weight: 400;
            font-size: 16px;
            margin: 0;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-group {
            position: relative;
        }

        .input-group .form-control {
            padding: 15px 20px 15px 50px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .input-group .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
            background: rgba(255, 255, 255, 1);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--medium-gray);
            font-size: 16px;
            z-index: 10;
            transition: color 0.3s ease;
        }

        .form-control:focus + .input-icon {
            color: var(--accent-color);
        }

        .btn-register {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border: none;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 16px;
            border-radius: 12px;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(44, 90, 160, 0.3);
        }

        .btn-register:hover::before {
            left: 100%;
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .login-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 14px;
        }

        .login-link a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 25px;
            animation: alertSlide 0.3s ease-out;
        }

        @keyframes alertSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-danger {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .alert-success {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            box-shadow: 0 4px 12px rgba(81, 207, 102, 0.3);
        }

        @media (max-width: 768px) {
            .register-form {
                margin: 20px;
                padding: 40px 30px;
            }
            
            .logo h2 {
                font-size: 24px;
            }
            
            .logo img {
                width: 60px;
                height: 60px;
            }
        }

        /* 로딩 애니메이션 */
        .btn-register.loading {
            pointer-events: none;
        }

        .btn-register.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-form">
            <div class="logo">
                <img src="/static/YidoLogo.png" alt="이도회계법인 로고">
                <h2>환영합니다</h2>
                <p>면세점 매칭시스템 계정을 생성해주세요</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
            </div>
            {% endif %}
            
            {% if success %}
            <div class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>{{ success }}
            </div>
            {% endif %}
            
            <form method="POST" action="/register/" id="registerForm">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-2"></i>아이디 <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="아이디를 입력하세요" required
                               value="{{ username if username else '' }}"
                               maxlength="50">
                        <i class="fas fa-user input-icon"></i>
                        <button type="button" class="btn btn-sm btn-outline-primary" 
                                id="checkUsernameBtn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); z-index: 20;">
                            중복확인
                        </button>
                    </div>
                    <div id="usernameCheckResult" class="mt-1"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope me-2"></i>이메일 <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="이메일을 입력하세요" required
                               value="{{ email if email else '' }}">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <small class="text-muted">승인 후 로그인 정보가 이 이메일로 발송됩니다</small>
                </div>
                
                <div class="form-group">
                    <label for="company_name" class="form-label">
                        <i class="fas fa-building me-2"></i>회사명 <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="company_name" name="company_name" 
                               placeholder="회사명을 입력하세요" required
                               value="{{ company_name if company_name else '' }}"
                               maxlength="100">
                        <i class="fas fa-building input-icon"></i>
                    </div>
                    <small class="text-muted">한 회사당 하나의 계정만 생성할 수 있습니다</small>
                </div>
                
                <div class="form-group">
                    <label for="position" class="form-label">
                        <i class="fas fa-id-badge me-2"></i>직책 <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="position" name="position" 
                               placeholder="직책을 입력하세요" required
                               value="{{ position if position else '' }}"
                               maxlength="50">
                        <i class="fas fa-id-badge input-icon"></i>
                    </div>
                </div>
                
                <div class="alert alert-info" role="alert" style="margin: 20px 0; background: linear-gradient(135deg, #17a2b8, #138496); color: white;">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>승인 절차 안내</strong><br>
                    <small>
                        • 신청 후 관리자 검토를 거쳐 승인됩니다<br>
                        • 승인 시 이메일로 로그인 정보를 안내드립니다<br>
                        • 비밀번호는 자동으로 생성되어 발송됩니다
                    </small>
                </div>
                
                <button type="submit" class="btn-register" id="registerBtn" disabled>
                    <span class="btn-text">
                        <i class="fas fa-paper-plane me-2"></i>신규가입 신청
                    </span>
                </button>
            </form>
            
            <div class="login-link">
                <a href="/login">
                    <i class="fas fa-sign-in-alt me-1"></i>이미 계정이 있으신가요? 로그인
                </a>
            </div>
        </div>
    </div>

    <script>
        let isUsernameChecked = false;
        let isUsernameAvailable = false;

        // 아이디 중복체크 버튼 클릭
        document.getElementById('checkUsernameBtn').addEventListener('click', function() {
            const username = document.getElementById('username').value.trim();
            const resultDiv = document.getElementById('usernameCheckResult');
            const checkBtn = this;

            if (!username) {
                resultDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> 아이디를 입력해주세요</small>';
                return;
            }

            if (username.length < 3) {
                resultDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> 아이디는 3자 이상이어야 합니다</small>';
                return;
            }

            // 로딩 상태
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            resultDiv.innerHTML = '<small class="text-muted"><i class="fas fa-spinner fa-spin"></i> 확인 중...</small>';

            // 중복체크 API 호출
            const formData = new FormData();
            formData.append('username', username);

            fetch('/check-username/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                isUsernameChecked = true;
                isUsernameAvailable = data.available;

                if (data.available) {
                    resultDiv.innerHTML = `<small class="text-success"><i class="fas fa-check-circle"></i> ${data.message}</small>`;
                } else {
                    resultDiv.innerHTML = `<small class="text-danger"><i class="fas fa-times-circle"></i> ${data.message}</small>`;
                }
                
                checkFormValidity();
            })
            .catch(error => {
                resultDiv.innerHTML = '<small class="text-danger"><i class="fas fa-exclamation-triangle"></i> 중복체크 중 오류가 발생했습니다</small>';
                isUsernameChecked = false;
                isUsernameAvailable = false;
            })
            .finally(() => {
                checkBtn.disabled = false;
                checkBtn.innerHTML = '중복확인';
            });
        });

        // 아이디 입력 시 중복체크 상태 초기화
        document.getElementById('username').addEventListener('input', function() {
            isUsernameChecked = false;
            isUsernameAvailable = false;
            document.getElementById('usernameCheckResult').innerHTML = '';
            checkFormValidity();
        });

        // 폼 유효성 검사
        function checkFormValidity() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const companyName = document.getElementById('company_name').value.trim();
            const position = document.getElementById('position').value.trim();
            const registerBtn = document.getElementById('registerBtn');

            const isValid = username && email && companyName && position && isUsernameChecked && isUsernameAvailable;
            
            registerBtn.disabled = !isValid;
            registerBtn.style.opacity = isValid ? '1' : '0.6';
        }

        // 모든 필수 입력 필드에 이벤트 리스너 추가
        ['username', 'email', 'company_name', 'position'].forEach(fieldId => {
            document.getElementById(fieldId).addEventListener('input', checkFormValidity);
        });

        // 회원가입 폼 제출 시 로딩 애니메이션
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            if (!isUsernameChecked || !isUsernameAvailable) {
                e.preventDefault();
                alert('아이디 중복확인을 먼저 해주세요.');
                return;
            }

            const registerBtn = document.getElementById('registerBtn');
            const btnText = registerBtn.querySelector('.btn-text');
            
            registerBtn.classList.add('loading');
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>신청 처리 중...';
            registerBtn.disabled = true;
            
            // 10초 후에도 응답이 없으면 원래 상태로 복구
            setTimeout(() => {
                if (registerBtn.classList.contains('loading')) {
                    registerBtn.classList.remove('loading');
                    btnText.innerHTML = '<i class="fas fa-paper-plane me-2"></i>신규가입 신청';
                    checkFormValidity();
                }
            }, 10000);
        });

        // 입력 필드 포커스 애니메이션
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // 키보드 단축키 비활성화 (실수 제출 방지)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                const activeElement = document.activeElement;
                if (activeElement.tagName === 'INPUT') {
                    e.preventDefault();
                    // Enter 키로는 제출하지 않고 다음 필드로 이동
                    const inputs = Array.from(document.querySelectorAll('input'));
                    const currentIndex = inputs.indexOf(activeElement);
                    if (currentIndex < inputs.length - 1) {
                        inputs[currentIndex + 1].focus();
                    }
                }
            }
        });

        // 페이지 로드 시 폼 유효성 검사
        document.addEventListener('DOMContentLoaded', function() {
            checkFormValidity();
        });
    </script>
</body>
</html>
